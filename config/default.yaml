input_dir: ./DUMPLING
output_dir: ./LIGHTNING
# Empty enabled_rules means all rules are enabled (minus disabled_rules).
enabled_rules: []
# JsonGenerated is only needed for legacy TiDB targets; modern TiDB (v6.3+)
# supports JSON functions in generated columns.
disabled_rules: [JsonGenerated]
# Output is written by the TiDB parser itself; backquote_identifiers: false
# emits bare names and breaks DDL that uses reserved words as identifiers.
formatting:
  indent_size: 2
  uppercase_keywords: true
  backquote_identifiers: true
  single_quote_strings: true
charset_mappings:
  latin1:
    target_charset: utf8mb4
    target_collation: utf8mb4_0900_ai_ci
collation_mappings:
  latin1_swedish_ci: utf8mb4_0900_ai_ci
  utf8mb4_unicode_*: utf8mb4_0900_ai_ci
# Function names kept in DEFAULT clauses; all other function defaults are
# stripped. Extend when targeting TiDB >= v8.0.0 (expression defaults).
allowed_default_functions:
  - current_timestamp
  - current_date
  - current_time
  - now
  - localtime
  - localtimestamp
# Zero-date DEFAULTs ('0000-00-00 ...') fail on TiDB under its default
# sql_mode (NO_ZERO_DATE/NO_ZERO_IN_DATE); they load with a permissive one
# (mariadb-dump output and TiDB Lightning set it). keep = warn, drop = remove.
zero_date_defaults: keep
# Opt-in: convert BIGINT AUTO_INCREMENT primary keys of these tables ("*" =
# all eligible) to AUTO_RANDOM to avoid write hotspots. UNSIGNED columns are
# refused (IDs would exceed 2^63-1, PHP_INT_MAX); range_bits 54 keeps every
# ID below 2^53 (exact in JavaScript), 64 is TiDB's default.
auto_random:
  tables: []
  shard_bits: 5
  range_bits: 54
# Opt-in: SHARD_ROW_ID_BITS for tables without a clustered primary key.
shard_row_id_bits: 0
pre_split_regions: 0
