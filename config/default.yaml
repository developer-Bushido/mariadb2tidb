input_dir: ./DUMPLING
output_dir: ./LIGHTNING
# Empty enabled_rules means all rules are enabled (minus disabled_rules).
enabled_rules: []
# JsonGenerated is only needed for legacy TiDB targets; modern TiDB (v6.3+)
# supports JSON functions in generated columns.
disabled_rules: [JsonGenerated]
strict_mode: true
preserve_comments: true
formatting:
  indent_size: 2
  uppercase_keywords: true
  backquote_identifiers: true
  single_quote_strings: true
charset_mappings:
  latin1:
    target_charset: utf8mb4
    target_collation: utf8mb4_0900_ai_ci
collation_mappings:
  latin1_swedish_ci: utf8mb4_0900_ai_ci
  utf8mb4_unicode_*: utf8mb4_0900_ai_ci
# Function names kept in DEFAULT clauses; all other function defaults are
# stripped. Extend when targeting TiDB >= v8.0.0 (expression defaults).
allowed_default_functions:
  - current_timestamp
  - current_date
  - current_time
  - now
  - localtime
  - localtimestamp
