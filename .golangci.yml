version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - misspell
    - revive
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - revive

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
